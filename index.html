<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>dear, TOKYO · Near &amp; Deem</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --page:#FDF3F6; --bg:#FFFAFB; --head:#FCDEE2; --card:#fff; --ink:#4A2E3B; --muted:#8C7280;
  --line:#F5E1E8; --brown:#F885A7;--priInk:#C9496F; --red:#D64570; --chip:#FCE6EC; --soft:#FCE6EC; --green:#FFF0F4; --greenInk:#C9496F;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--page);color:var(--ink);font-family:"Noto Sans Thai",system-ui,sans-serif;line-height:1.55;font-size:15px}
a{color:inherit}
.app{max-width:720px;margin:0 auto;background:var(--bg);min-height:100vh;padding-bottom:96px;box-shadow:0 0 0 1px var(--line)}
header.top{background:var(--head);display:grid;grid-template-columns:76px 1fr 76px;align-items:center;padding:18px 18px;border-bottom:1px solid #F6C6D3}
.logo{width:52px;height:52px;border-radius:14px;background:#fff;display:grid;place-items:center;font-size:30px;box-shadow:0 2px 6px rgba(0,0,0,.08)}
.ttl{text-align:center}
.ttl b{display:block;font-size:22px;letter-spacing:.06em;font-weight:800}
.ttl span{display:block;font-size:13px;color:var(--muted);font-weight:600;letter-spacing:.04em}
.ttl b i{font-family:Georgia,"Times New Roman",serif;font-weight:400;font-style:italic;letter-spacing:0;color:var(--priInk);margin-right:2px}
.ttl .tag{font-size:12px;color:var(--priInk);font-weight:600;letter-spacing:.02em;margin-top:3px;opacity:.85}
.ttl .who{font-size:14px;color:var(--priInk);font-weight:700;letter-spacing:.08em;margin:2px 0 1px}
.langs{justify-self:end;display:flex;background:#fff;border-radius:10px;padding:3px;box-shadow:0 2px 6px rgba(0,0,0,.08)}
.langs button{font:inherit;font-size:12.5px;font-weight:700;border:0;background:none;color:var(--muted);padding:5px 8px;border-radius:7px;cursor:pointer}
.langs button.on{background:var(--brown);color:#fff}
.days{display:flex;gap:10px;overflow-x:auto;padding:18px 18px 4px;scrollbar-width:none}
.days::-webkit-scrollbar{display:none}
.days a{flex:0 0 auto;text-decoration:none;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 16px;text-align:center;min-width:128px}
.days a b{display:block;font-size:17px;font-weight:700}
.days a small{color:var(--muted);font-size:12.5px}
.days a.on{background:var(--brown);border-color:var(--brown);color:#fff}
.days a.on small{color:#FFF0F4}
.banner{margin:16px 18px 6px;background:#FCDEE2;border-left:5px solid var(--brown);border-radius:14px;padding:14px 16px;font-weight:700;font-size:16px}
.banner small{display:block;font-weight:500;color:var(--muted);font-size:13px}
.tl{position:relative;margin:14px 18px 0;padding-left:26px}
.tl:before{content:"";position:absolute;left:7px;top:14px;bottom:14px;width:2px;background:#F6C6D3}
.it{position:relative;margin-bottom:12px}
.it:before{content:"";position:absolute;left:-26px;top:22px;width:12px;height:12px;border-radius:50%;background:var(--bg);border:3px solid var(--brown)}
.it.first:before{background:var(--red);border-color:var(--red);width:16px;height:16px;left:-28px;top:20px}
.it.leg:before{border-width:2px;width:10px;height:10px;left:-25px;border-color:#D9A3B5;top:20px}
.cd{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.leg .cd{background:#FFF7FA;border-style:dashed}
.hd{display:grid;grid-template-columns:auto 1fr 22px;gap:12px;align-items:center;padding:12px 14px;cursor:pointer;width:100%;background:none;border:0;text-align:left;font:inherit;color:inherit}
.tm{background:var(--chip);color:var(--priInk);font-weight:700;border-radius:8px;padding:4px 9px;font-size:14.5px;font-variant-numeric:tabular-nums;text-align:center;min-width:58px;line-height:1.25}
.tm small{display:block;font-size:10px;font-weight:500}
.leg .tm{background:#FCE6EC;font-size:17px;padding:3px 9px}
.nm{min-width:0}
.nm b{display:block;font-weight:700;font-size:15.5px;line-height:1.35}
.nm span{display:block;color:var(--muted);font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ar{color:var(--priInk);font-size:14px;transition:transform .15s}
.it.open .ar{transform:rotate(180deg)}
.it.open .nm span{white-space:normal}
.nm em{display:block;font-style:normal;font-size:12.5px;color:var(--priInk);font-weight:600;margin:1px 0}
.via{background:#FFF0F4;border-radius:12px;padding:10px 12px;margin-bottom:10px}
.vh{font-weight:700;font-size:13.5px;margin-bottom:6px;color:var(--priInk)}
.st{display:grid;grid-template-columns:26px 1fr;gap:8px;padding:8px 0;border-top:1px dashed #F3D3DD;font-size:13.5px}
.st:first-of-type{border-top:0;padding-top:2px}
.si{font-size:17px;line-height:1.4}
.sr{font-weight:600}
.dep{background:var(--chip);color:var(--priInk);border-radius:6px;padding:0 6px;margin-right:6px;font-size:12px}
.sh{margin-top:1px}
.sm,.sn{color:var(--muted);font-size:12.5px}
.sl{display:inline-block;margin-top:3px;font-size:12.5px;font-weight:600;color:var(--priInk)}
.bd{display:none;padding:0 14px 14px}
.it.open .bd{display:block}
.bd hr{border:0;border-top:1px dashed var(--line);margin:0 0 12px}
.bd p{margin:0 0 10px;font-size:14px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.chips span,.chips a{font-size:12.5px;border:1px solid var(--line);border-radius:8px;padding:3px 9px;background:#fff;text-decoration:none;font-weight:600}
.chips .g{background:var(--green);color:var(--greenInk);border-color:#F6C6D3}
.chips .r{background:#FCDEE2;color:var(--red);border-color:#F6C6D3}
.chips a{color:var(--priInk);background:var(--chip);border-color:#F6C6D3}
.tip{background:var(--soft);border-radius:12px;padding:12px 14px;font-size:13.5px;margin-bottom:10px}
.tip b{display:block;margin-bottom:4px}
.tip ul{margin:0;padding-left:18px}
.sec{margin:20px 18px 0}
.sec h2{font-size:18px;margin:0 0 10px}
.box{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px;margin-bottom:12px}
.box h3{margin:0 0 4px;font-size:16px}
.box p{margin:4px 0;font-size:14px;color:var(--muted)}
.box .big{font-size:20px;font-weight:800;color:var(--ink);letter-spacing:.02em}
.box .row{display:flex;justify-content:space-between;gap:10px;align-items:center}
.tk{position:relative;display:grid;grid-template-columns:1fr 150px;background:#fff;border-radius:18px;margin-bottom:16px;box-shadow:0 6px 18px rgba(248,133,167,.18);overflow:hidden}
.tk-main{padding:0 0 16px}
.tk-top{grid-column:1/-1;display:flex;justify-content:space-between;align-items:center;background:var(--brown);color:#fff;padding:9px 16px;font-size:12.5px;letter-spacing:.06em}
.tk-top span{white-space:nowrap}
@media (max-width:400px){.tk-top{font-size:11px;letter-spacing:.02em;padding:9px 12px}.tk-top b{font-size:13px}}
.tk-top b{font-size:14px;letter-spacing:.08em}
.tk-route{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:16px 16px 6px}
.tk-route .r{text-align:right}
.iata{font-size:34px;font-weight:800;letter-spacing:.04em;line-height:1;color:var(--ink)}
.city{font-size:11.5px;color:var(--muted);margin-top:3px}
.path{display:flex;align-items:center;gap:4px;position:relative;color:var(--priInk);padding-bottom:14px}
.path .line{flex:1;border-top:2px dashed #F6C6D3}
.path .dot{width:7px;height:7px;border-radius:50%;background:var(--brown)}
.path .pl{font-size:18px}
.path small{position:absolute;bottom:-2px;left:0;right:0;text-align:center;font-size:11px;color:var(--muted)}
.tk-grid{display:grid;grid-template-columns:repeat(4,auto);justify-content:space-between;gap:8px;padding:8px 16px 0}
.tk label,.tk-stub label{display:block;font-size:10px;letter-spacing:.08em;color:var(--muted);font-weight:600}
.tk-grid b{font-size:14px}
.tk-grid sup{font-size:10px;color:var(--red);margin-left:2px}
.tk-stub{background:#FCDEE2;border-left:2px dashed #F6C6D3;padding:16px 14px;display:flex;flex-direction:column;gap:10px;position:relative}
.tk-stub b{font-size:14px}
.tk-note{font-size:11.5px;color:var(--muted);margin-top:auto}
.tk-stub:before,.tk-stub:after{content:"";position:absolute;left:-12px;width:22px;height:22px;border-radius:50%;background:var(--bg)}
.tk-stub:before{top:-11px}.tk-stub:after{bottom:-11px}
@media (max-width:520px){
  .tk{grid-template-columns:1fr}
  .tk-stub{border-left:0;border-top:2px dashed #F6C6D3;flex-direction:row;flex-wrap:wrap;gap:14px}
  .tk-note{width:100%;margin-top:0}
  .tk-stub:before,.tk-stub:after{top:-12px;bottom:auto}
  .tk-stub:before{left:-11px}.tk-stub:after{left:auto;right:-11px}
  .tk-grid{grid-template-columns:repeat(2,1fr);row-gap:10px}
  .tk-grid div:nth-child(even){text-align:right}
}
.hotel .jp{font-size:13px;color:var(--muted);margin-top:-2px}
.hotel dl{margin:10px 0 12px;display:grid;grid-template-columns:auto 1fr;gap:6px 12px;font-size:13.5px;background:#FFF0F4;border-radius:12px;padding:10px 12px}
.hotel dt{color:var(--muted);font-weight:600;font-size:12.5px;white-space:nowrap}
.hotel dd{margin:0;user-select:all}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.acts button,.acts a{font:inherit;font-size:13.5px;font-weight:600;border:1px solid #F6C6D3;background:var(--chip);color:var(--priInk);border-radius:10px;padding:9px 10px;text-align:center;text-decoration:none;cursor:pointer}
.acts button:active{transform:scale(.98)}
.copied{height:0;overflow:hidden;opacity:0;transition:opacity .2s;font-size:13px;color:var(--greenInk);text-align:center}
.copied.show{height:auto;opacity:1;margin-top:8px}
.ph h3{font-size:15px;margin:20px 0 8px;color:var(--priInk)}
.phsub{margin:0;color:var(--muted);font-size:13px}
.pr{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:7px}
.pt{cursor:pointer;min-width:0}
.pj{font-size:18px;font-weight:700;line-height:1.35;font-family:"Hiragino Sans","Noto Sans JP","Yu Gothic",sans-serif}
.pro{font-size:12.5px;color:var(--priInk);font-style:italic}
.pm{font-size:13.5px;color:var(--muted)}
.spk{font-size:18px;border:1px solid #F6C6D3;background:var(--chip);border-radius:10px;width:40px;height:40px;cursor:pointer}
.big-ov{position:fixed;inset:0;background:rgba(74,46,59,.5);z-index:20;display:grid;place-items:center;padding:20px}
.big-ov[hidden]{display:none}
.big-card{background:#fff;border-radius:20px;padding:28px 22px;max-width:560px;width:100%;text-align:center}
.bj{font-size:clamp(30px,9vw,52px);font-weight:800;line-height:1.3;font-family:"Hiragino Sans","Noto Sans JP","Yu Gothic",sans-serif;word-break:keep-all;overflow-wrap:anywhere}
.bm{color:var(--muted);margin:14px 0 18px;font-size:14px}
.bx{font:inherit;font-weight:600;border:0;background:var(--brown);color:#fff;border-radius:10px;padding:10px 28px;cursor:pointer}
nav.bot a{font-size:12px}
.mapwrap{overflow-x:auto;margin:8px -16px 10px;padding:0 16px;-webkit-overflow-scrolling:touch}
.mapwrap svg{display:block;min-width:640px;width:100%;height:auto;border-radius:12px;border:1px solid var(--line)}
.legend{display:grid;grid-template-columns:1fr 1fr;gap:6px 14px;font-size:12.5px}
.legend div{display:grid;grid-template-columns:22px 1fr;column-gap:6px;align-items:center}
.legend i{height:6px;border-radius:3px;display:block}
.legend small{grid-column:2;color:var(--muted);font-size:11px;margin-top:-2px}
@media (max-width:520px){.legend{grid-template-columns:1fr}}
.h2row{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.h2row h2,.h2row .pdfbtn{white-space:nowrap}
@media (max-width:400px){.h2row h2{font-size:16px}.h2row .pdfbtn{font-size:11.5px;padding:3px 8px}}
.h2row h2{margin:0}
.h2row .pdfbtn{margin:0}
.pdfbtn{display:inline-block;text-decoration:none;background:var(--chip);color:var(--priInk);border:1px solid #F6C6D3;border-radius:8px;padding:4px 10px;margin:0 0 12px;font-weight:600;font-size:12.5px}
.tips ul{margin:6px 0 4px;padding-left:18px;font-size:14px}
.tips li{margin-bottom:4px}
.tips .chips{margin-top:8px}
.phones{display:grid;gap:6px;margin-top:8px}
.phones a{display:flex;justify-content:space-between;align-items:center;gap:10px;text-decoration:none;background:#FFF0F4;border-radius:10px;padding:8px 12px;font-size:13.5px}
.phones b{font-size:17px;color:var(--red);font-variant-numeric:tabular-nums;white-space:nowrap}
.chk h3{font-size:15px;margin:20px 0 8px;color:var(--priInk)}
.chk label{display:flex;gap:10px;align-items:flex-start;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:7px;cursor:pointer}
.chk input{margin-top:4px;accent-color:var(--brown);width:18px;height:18px;flex:0 0 auto}
.chk .x b{font-weight:600}
.chk .x .w{color:var(--priInk);font-size:12px;margin-left:6px;background:var(--chip);border-radius:6px;padding:1px 6px}
.chk .x p{margin:3px 0 0;color:var(--muted);font-size:13px;white-space:pre-line}
.chk label.done{background:#FFF0F4}
.chk label.done .x b{text-decoration:line-through;color:var(--muted)}
.prog{height:8px;background:var(--line);border-radius:8px;overflow:hidden;margin:4px 0}
.prog div{height:100%;background:var(--brown);transition:width .2s}
nav.bot{position:fixed;bottom:0;left:0;right:0;z-index:10}
nav.bot .in{max-width:720px;margin:0 auto;background:#fff;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);padding:8px 0 calc(8px + env(safe-area-inset-bottom))}
nav.bot a{text-decoration:none;text-align:center;font-size:13px;font-weight:600;color:var(--muted);padding:4px 0;position:relative}
nav.bot a i{display:block;font-style:normal;font-size:24px;line-height:1.2}
nav.bot a.on{color:var(--priInk)}
nav.bot a.on:after{content:"";position:absolute;bottom:-4px;left:50%;width:26px;height:3px;border-radius:3px;background:var(--brown);transform:translateX(-50%)}
.note{color:var(--muted);font-size:12px;text-align:center;margin:20px 18px}
.via{background:#FFF0F4;border:1px solid #F9D3DE}
.phones a{background:#FFF0F4}
.hotel dl{background:#FFF0F4}
.tip{background:#FCE6EC;border:1px solid #F6C6D3}
.tips .box{border-top:4px solid #FCDEE2}
.tips .box:nth-child(odd){border-top-color:#F9C4D2}
.days a.on small{color:#fff}
</style>
</head>

<div class="app">
  <header class="top">
    <div class="logo">🗻</div>
    <div class="ttl"><b><i>dear,</i> TOKYO</b><span>2 – 7 DEC 2026</span><span class="tag">#DearTokyoNearAndDeem</span></div>

</div>

 ตอนค่ำอาจต้องต่อคิว": "① The crosswalk by 7-Eleven Shiba 3-chome next to Akabanebashi Station. Famous on social media, may have a queue in the evening", "② บันไดลานจอดรถใต้ดินริมหุบเขาโมมิจิ (もみじ谷) ระหว่างทางขึ้นไปทาวเวอร์ ทาวเวอร์อยู่ในกรอบบันได": "② The underground car park stairs by Momiji Valley (もみじ谷) on the way up to the tower, framing the tower", "③ สวนชิบะ (Shiba Park) มุมสนามหญ้าและบันไดในสวน เห็นทาวเวอร์เต็มต้น คนน้อยกว่าจุดอื่น": "③ Shiba Park lawn and stairs, with the whole tower in frame and fewer people", "④ ประตูซังเงะดัตสึมง วัดโซโจจิ มุมวัดเก่าตัดกับทาวเวอร์ ตัววัดปิด 17:00 แต่ถ่ายจากลานหน้าประตูได้": "④ Sangedatsumon gate of Zojoji Temple, old temple against the tower. The temple closes at 17:00 but you can shoot from the gate area", "บางคืนเปลี่ยนเป็นไฟ Diamond Veil เช็คปฏิทินไฟที่ tokyotower.co.jp/lightup ก่อนไป": "Some nights switch to Diamond Veil lighting. Check the calendar at tokyotower.co.jp/lightup before going", "วัดโซโจจิ": "Zojoji Temple", "สถานี Daimon (E-20)": "Daimon Station (E-20)", "~7 นาที": "~7 min", "เดินลอดประตูไดมง (大門) ไปทางตะวันออก ทางลงสถานีอยู่ริมถนน": "Walk east through the Daimon gate (大門). The station entrance is by the road", "Oedo (ฝั่ง Akabanebashi / Roppongi)": "Oedo (towards Akabanebashi / Roppongi)", "~20 นาที": "~20 min", "ขึ้นขบวนฝั่ง Akabanebashi (赤羽橋方面) ไม่ต้องเปลี่ยนสาย": "Take the train towards Akabanebashi (赤羽橋方面), no transfer", "เดินไปฝั่ง East Exit แล้วขึ้นเหนือเข้าคาบุกิโจ ถึงโรงแรมราว 20:30 คืนนี้พักเร็ว พรุ่งนี้ออก 08:00": "Walk to the East Exit side and north into Kabukicho, reaching the hotel around 20:30. Early night, leaving at 08:00 tomorrow", "คืนชุดก่อนกินมื้อเที่ยง จะได้ไม่ต้องกลัวน้ำซุปเปื้อน ร้านส่วนใหญ่ให้คืนได้ถึง 16:30-17:30": "Return the kimono before lunch so there's no worry about soup stains. Most shops accept returns until 16:30-17:30"};

function groupStops(items){
  const stops = []; let pending = [];
  for (const it of items){
    if (it.k === "l" && it.back && stops.length) stops[stops.length - 1].after.push(it);
    else if (it.k === "l") pending.push(it);
    else { stops.push({...it, via: pending, after: []}); pending = []; }
  }
  if (pending.length && stops.length) stops[stops.length - 1].after = pending;
  return stops;
}

function copyText(text){
  const fallback = () => {
    const ta = document.createElement("textarea");
    ta.value = text; ta.setAttribute("readonly", ""); ta.style.position = "fixed"; ta.style.opacity = "0";
    document.body.appendChild(ta); ta.select();
    let ok = false; try { ok = document.execCommand("copy"); } catch(e){}
    ta.remove(); return ok;
  };
  try {
    if (navigator.clipboard && navigator.clipboard.writeText) return navigator.clipboard.writeText(text).then(() => true, fallback);
  } catch(e){}
  return Promise.resolve(fallback());
}

      <div class="chips"><a href="https://www.klook.com/th/activity/2274-narita-airport-limousine-bus-tokyo/" target="_blank" rel="noopener">${tx("ตั๋ว Klook ↗","Klook tickets ↗")}</a></div></div>
    <div class="box"><h3>${tx("Suica (2 ใบ)","Suica (2 cards)")}</h3>
      <p>${tx("ซื้อที่ JR East Travel Service Center สถานี Airport Terminal 2·3 (ชั้น B1) ค่ามัดจำ ¥500 ต่อใบ","Buy at the JR East Travel Service Center, Airport Terminal 2·3 station (B1). ¥500 deposit each")}</p>
      <p>${tx("ใช้ได้กับรถไฟ JR, Metro, Toei, โมโนเรล Disney และร้านสะดวกซื้อ ถ้าหมดซื้อที่ JR ชินจูกุแทน","Works on JR, Metro, Toei, the Disney monorail and at convenience stores. If sold out, buy at JR Shinjuku")}</p></div>
    <div class="box map"><h3>${tx("🗺️ แผนที่รถไฟ (เฉพาะสายที่ใช้ในทริปนี้)","🗺️ Rail map (only lines used on this trip)")}</h3>
      <p>${tx("วาดแบบย่อ ไม่ตรงสเกล เลื่อนซ้าย-ขวาได้ · 🏨 = โรงแรม","Simplified and not to scale, scroll sideways · 🏨 = hotel")}</p>
      <div class="mapwrap">${railMapSvg()}</div>
      <div class="legend">${RAIL_LINES.map(l => `<div><i style="background:${l.c}${l.dash ? ";background:repeating-linear-gradient(90deg," + l.c + " 0 6px,transparent 6px 10px)" : ""}"></i><span>${esc(tx(l.th, l.en))}</span><small>${tx("ใช้ " + l.days + " Dec", "used " + l.days + " Dec")}</small></div>`).join("")}</div>
      <p style="margin-top:10px">${tx("แผนที่ฉบับเต็มของจริง:","Full official maps:")}</p>
      <div class="chips"><a href="https://www.tokyometro.jp/en/subwaymap/index.html" target="_blank" rel="noopener">Tokyo Metro ↗</a><a href="https://www.kotsu.metro.tokyo.jp/eng/maps/subway/" target="_blank" rel="noopener">Toei Subway ↗</a><a href="https://www.jreast.co.jp/e/" target="_blank" rel="noopener">JR East ↗</a></div>
</div>
  </div>`;
  const label = {name:tx("ชื่อโรงแรม","hotel name"), addrEn:tx("ที่อยู่ (ENG)","address (EN)"), addrJp:tx("ที่อยู่ (JP)","address (JP)")};
  view.querySelectorAll("[data-copy]").forEach(btn => btn.addEventListener("click", () => {
    const k = btn.dataset.copy, out = document.getElementById("copied");
    copyText(HOTEL[k]).then(ok => {
      out.textContent = ok ? tx(`✓ คัดลอก${label[k]}แล้ว`, `✓ Copied ${label[k]}`) : tx("คัดลอกไม่ได้ กดค้างที่ข้อความด้านบนเพื่อคัดลอกเอง","Couldn't copy. Press and hold the text above to copy it");
      out.classList.add("show"); clearTimeout(out._t); out._t = setTimeout(() => out.classList.remove("show"), 2000);
    });
  }));
}

function speak(text){
  try {
    const u = new SpeechSynthesisUtterance(text.replace(/〇〇/g, ""));
    u.lang = "ja-JP"; u.rate = 0.85;
    speechSynthesis.cancel(); speechSynthesis.speak(u);
  } catch(e){}
}

function renderPhrases(){
  const canSpeak = (() => { try { return "speechSynthesis" in window && typeof SpeechSynthesisUtterance === "function"; } catch(e){ return false; } })();
  view.innerHTML = `<div class="sec ph"><h2>${tx("🗣️ ภาษาญี่ปุ่นที่ใช้บ่อย","🗣️ Handy Japanese")}</h2>
    <p class="phsub">${tx("กดที่ประโยคเพื่อขยายตัวอักษรให้คนญี่ปุ่นอ่าน","Tap a phrase to show it large to staff")}${canSpeak ? tx(" · กด 🔊 เพื่อฟังเสียง"," · tap 🔊 to hear it") : ""}</p>
    ${PHRASES.map((g, gi) => `<h3>${esc(tx(g.th, g.en))}</h3>` + g.items.map(([jp, ro, th, en], i) => `
      <div class="pr" data-g="${gi}" data-i="${i}">
        <div class="pt"><div class="pj" lang="ja">${esc(jp)}</div><div class="pro">${esc(ro)}</div><div class="pm">${esc(tx(th, en))}</div></div>
        ${canSpeak ? `<button type="button" class="spk" aria-label="speak">🔊</button>` : ""}
      </div>`).join("")).join("")}
  </div>
  <div class="big-ov" id="bigov" hidden><div class="big-card"><div class="bj" lang="ja"></div><div class="bm"></div><button type="button" class="bx">${tx("ปิด","Close")}</button></div></div>`;
  const ov = document.getElementById("bigov");
  view.querySelectorAll(".pr").forEach(el => {
    const [jp, ro, th, en] = PHRASES[el.dataset.g].items[el.dataset.i];
    el.querySelector(".pt").addEventListener("click", () => {
      ov.querySelector(".bj").textContent = jp;
      ov.querySelector(".bm").textContent = ro + " · " + tx(th, en);
      ov.hidden = false;
    });
    const s = el.querySelector(".spk"); if (s) s.addEventListener("click", () => speak(jp));
  });
  ov.addEventListener("click", e => { if (e.target === ov || e.target.classList.contains("bx")) ov.hidden = true; });
}

function renderTips(){
  view.innerHTML = `<div class="sec tips"><h2>${tx("💡 ข้อควรรู้","💡 Good to know")}</h2>
    ${TIPS.map(s => `<div class="box"><h3>${s.icon} ${esc(tx(s.th, s.en))}</h3>
      ${s.items ? `<ul>${s.items.map(i => `<li>${esc(tx(i.th, i.en))}</li>`).join("")}</ul>` : ""}
      ${s.phones ? `<div class="phones">${s.phones.map(p => `<a href="tel:${encodeURIComponent(p.num.replace(/-/g, ""))}"><span>${esc(tx(p.th, p.en))}</span><b>${esc(p.num)}</b></a>`).join("")}</div>` : ""}
      ${s.links ? `<div class="chips">${s.links.map(l => `<a href="${esc(l.url)}" target="_blank" rel="noopener">${esc(tx(l.th, l.en))} ↗</a>`).join("")}</div>` : ""}
    </div>`).join("")}</div>`;
}

function renderChecklist(){
  let total = 0, done = 0;
  const groups = CHECK_V.map((g, gi) => `<h3>${esc(g.title)}</h3>` + g.items.map(([name, when, note, sheetDone], i) => {
    const key = gi + "-" + i;
    const on = key in checks ? checks[key] : sheetDone;
    total++; if (on) done++;
    return `<label class="${on ? "done" : ""}"><input type="checkbox" data-k="${key}" ${on ? "checked" : ""}>
      <span class="x"><b>${esc(name)}</b>${when ? `<span class="w">${esc(when)}</span>` : ""}${note ? `<p>${esc(note)}</p>` : ""}</span></label>`;
  }).join("")).join("");
  view.innerHTML = `<div class="sec chk"><h2>${tx("✅ เช็คลิสต์","✅ Checklist")}</h2><p style="margin:0;color:var(--muted);font-size:13px">${tx("เสร็จแล้ว","Done")} ${done} / ${total} · ${tx("ติ๊กได้ บันทึกไว้ในเครื่องนี้เท่านั้น","saved on this device only")}</p>
    <div class="prog"><div style="width:${Math.round(done/total*100)}%"></div></div>${groups}</div>`;
  view.querySelectorAll("input[type=checkbox]").forEach(cb => cb.addEventListener("change", () => {
    checks[cb.dataset.k] = cb.checked; store.set("jp-check", checks); renderChecklist();
  }));
}

const UI = {
  plan:["แผนรายวัน","Daily plan"], info:["เดินทาง/ที่พัก","Flights & hotel"], japanese:["ภาษาญี่ปุ่น","Japanese"], tips:["ข้อควรรู้","Good to know"]
};
function applyLang(){
  DAYS_V = lang === "en" ? trDeep(DAYS) : DAYS;
  CHECK_V = lang === "en" ? trDeep(CHECK) : CHECK;
  document.documentElement.lang = lang;
  document.querySelectorAll("#bot a").forEach(a => { a.querySelector("span").textContent = UI[a.dataset.id][lang === "en" ? 1 : 0]; });
  document.querySelectorAll("#langs button").forEach(b => b.classList.toggle("on", b.dataset.lang === lang));
}
document.querySelectorAll("#langs button").forEach(b => b.addEventListener("click", () => {
  if (b.dataset.lang === lang) return;
  const y = window.scrollY;
  lang = b.dataset.lang; store.set("jp-lang", lang); applyLang(); route(); window.scrollTo(0, y);
}));

function route(){
  const h = (location.hash || "").slice(1);
  const d = DAYS_V.find(x => x.id === h);
  const tab = ["info","tips","japanese"].includes(h) ? h : "plan";
  document.querySelectorAll("#bot a").forEach(a => a.classList.toggle("on", a.dataset.id === tab));
  if (tab === "info") renderInfo();
  else if (tab === "tips") renderTips();
  else if (tab === "japanese") renderPhrases();
  else renderDay(d || DAYS_V[0]);
  window.scrollTo(0, 0);
}
window.addEventListener("hashchange", route);
applyLang();
route();
</script>
</body></html>
